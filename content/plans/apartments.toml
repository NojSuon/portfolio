# Typical floor of an apartment building: four flats around a central stair
# and lift. The west flats are drawn once and mirrored to the east
# (`mirror_x`). See README.md for the format.

[[level]]
name = "Typical floor"
outline = [[0, 0], [28000, 0], [28000, 14000], [0, 14000]]
xdims = [0, 5600, 9000, 11600, 14000, 16400, 19000, 22400, 28000]
ydims = [0, 3800, 6000, 8000, 10200, 14000]

# Core: stair, lift, bins and riser, and the corridor.
partitions = [
  [14000, 0, 14000, 6000, 200],
  [14000, 3600, 16400, 3600, 200],
  [11600, 6000, 16400, 6000, 200],
]
doors = [
  { at = [12000, 6000], w = 1000, run = "E", swing = "N" },
  { at = [14600, 6000], w = 1100, run = "E", style = "slide" },
  { at = [14000, 500], w = 800, run = "S", swing = "E" },
]
windows = [{ at = [12200, 0], w = 1200, run = "E" }]
