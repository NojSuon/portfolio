The chinampa can be opened into its nine layers (stakes, logs, tule, mud, soil) and read in an axonometric view, one layer at a time. Around it, the life of the lake: reeds, fish, axolotls, herons, and the volcanoes on the horizon.

Available in Spanish, English and Chinese.
"""
