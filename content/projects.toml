summary.en = "A typical floor of a residential block: four flats, two of two bedrooms and two of three, around one stair, one lift and a short corridor."
summary.ko = "주거동의 기준층. 침실 두 개짜리 두 세대와 세 개짜리 두 세대, 모두 네 세대가 계단 하나, 엘리베이터 하나, 짧은 복도를 둘러싸고 있어요."
body.es = """
El núcleo está en medio del lado norte, así que el pasillo es corto y cada departamento tiene su puerta a unos pasos del elevador. Los departamentos de dos dormitorios miran al norte y al oeste o al este; los de tres ocupan todo el frente sur y las dos esquinas.

Cada departamento se organiza igual: un pequeño vestíbulo que da privacidad a los dormitorios, una sala con la cocina abierta en la fachada y los baños hacia el interior. La mitad este de la planta es la mitad oeste en espejo.
"""
body.en = """
The core sits in the middle of the north side, so the corridor stays short and every flat has its door within a few steps of the lift. The two-bedroom flats face north and west or east; the larger three-bedroom flats take the whole south front and both corners.

Each flat is planned the same way: a small hall that keeps the bedrooms private, a living room with an open kitchen on the facade, and bathrooms on the inside. The east half of the floor is the west half mirrored.
"""
body.ko = """
코어가 북쪽 면의 가운데에 있어 복도가 짧고, 모든 세대의 현관이 엘리베이터에서 몇 걸음 거리에 있어요. 침실 두 개 세대는 북쪽과 서쪽 또는 동쪽을 바라보고, 더 큰 침실 세 개 세대는 남쪽 면 전체와 양쪽 모서리를 차지해요.

모든 세대는 같은 방식으로 계획되었어요. 침실의 사생활을 지켜 주는 작은 현관 홀, 파사드 쪽에 열린 주방을 둔 거실, 그리고 안쪽의 욕실. 층의 동쪽 절반은 서쪽 절반을 거울에 비춘 모습이에요.
"""
plan = "apartments"

[[project]]
slug = "shopping-arcade"
title.es = "Pasaje comercial"
title.en = "Shopping Arcade"
title.ko = "쇼핑 아케이드"
discipline = "plans"
year = "2026"
kind.es = "Comercio · Calle cubierta"
kind.en = "Retail · Covered street"
kind.ko = "상업 · 지붕 덮인 거리"
summary.es = "Una calle cubierta que atraviesa una manzana: seis locales en una retícula de 7.2 m, frentes de vidrio al pasaje, puertas de servicio al fondo, y un café y baños públicos al final."
summary.en = "A covered street through a block: six shop units on a 7.2 m grid, glazed fronts onto the arcade, service doors to the back, and a café and public WCs at the end."
summary.ko = "블록을 관통하는 지붕 덮인 거리. 7.2 m 격자 위의 점포 여섯 개, 아케이드를 향한 유리 전면, 뒤쪽의 서비스 출입구, 그리고 끝에는 카페와 공용 화장실이 있어요."
body.es = """
El pasaje es una calle con techo: abierta en ambos extremos, empedrada, con árboles y bancas entre las columnas. Cada local ocupa la misma crujía de 7.2 m, así que un inquilino puede tomar una, o unir dos o tres.

Cada tienda tiene dos caras. El frente es de vidrio hacia el pasaje; el fondo es una bodega con su propia puerta de servicio al patio de carga, para que la mercancía nunca cruce la calle pública. La última crujía guarda lo que todos comparten: los baños al norte y un café al sur, con sus mesas hacia la luz de la entrada este.
"""
body.en = """
The arcade is a street with a roof: open at both ends, paved, planted, with benches between the columns. Each unit is the same 7.2 m bay, so tenants can take one, or knock through to two or three.

Every shop has two faces. The front is glass onto the arcade; the back is a store with its own service door to the delivery yard, so goods never cross the public street. The last bay holds what everyone shares: the WCs to the north and a café to the south, its tables spilling towards the light at the east entrance.
"""
body.ko = """
아케이드는 지붕이 있는 거리예요. 양 끝이 열려 있고, 바닥은 포장되어 있으며, 기둥 사이에는 나무와 벤치가 있어요. 모든 점포는 같은 7.2 m 칸이므로 임차인은 한 칸을 쓰거나, 두세 칸을 터서 쓸 수 있어요.

모든 점포에는 두 개의 얼굴이 있어요. 앞면은 아케이드를 향한 유리이고, 뒷면은 하역장으로 통하는 서비스 문이 따로 있는 창고여서 물건이 공공의 거리를 가로지르지 않아요. 마지막 칸에는 모두가 함께 쓰는 공간이 있어요. 북쪽에는 화장실, 남쪽에는 카페가 있고, 카페의 테이블은 동쪽 입구의 빛을 향해 놓여 있어요.
"""
plan = "arcade"

