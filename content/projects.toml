# One [[project]] per sheet. Sheets are grouped by discipline and numbered in
# the order they appear here: A-01, A-02… / T-01… / D-01…
#
#   slug        URL name: work/<slug>/ (a-z, 0-9 and - only)
#   title       Project name
#   discipline  "architecture", "plans", "tools" or "art"
#   year        In quotes, e.g. "2026" or "2024–2026"
#   kind        One short line: type, place, medium…
#   summary     One or two sentences, shown under the title
#   body        Longer text; separate paragraphs with a blank line (optional)
#   facts       Extra rows for the title block (optional)
#   links       Buttons to live sites, source, publications (optional)
#   images      Files you put in static/, e.g. static/images/casa/1.jpg →
#               src = "images/casa/1.jpg". The first one is the preview.
#               Without images, a drawing is generated for the project.
#   plan        A floor plan drawn from content/plans/<plan>.toml (optional)
#   draft       true = shown only in the local preview, never on the live site

