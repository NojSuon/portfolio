summary.es = "Una casa familiar de dos plantas sobre una huella de 10 × 8.4 m: estar abierto abajo, cuatro espacios para dormir y asearse arriba, y una escalera recta entre ambos."
summary.en = "A two-storey family house on a 10 × 8.4 m footprint: open living below, four rooms to sleep and wash above, one straight stair between them."
summary.ko = "10 × 8.4 m 대지 위의 2층 가족 주택. 아래층에는 열린 생활 공간, 위층에는 잠자고 씻는 네 개의 방, 그 사이를 곧은 계단 하나가 이어 줘요."
body.es = """
El vestíbulo corre de la puerta de entrada al lado del jardín, con la escalera junto a su muro, así que a cada espacio se llega sin cruzar otro. Estudio, medio baño y cocina se abren a él; sala y comedor se encuentran en una sola habitación larga al fondo, abiertos entre sí y al jardín.

Arriba, el vestíbulo rodea el hueco de la escalera. Dos dormitorios iguales ocupan el lado oeste, el baño y el dormitorio principal el este, y el baño privado queda sobre el vestíbulo, entre ellos.
"""
body.en = """
The hall runs from the front door to the garden side of the house, with the stair along its wall, so every room is reached without crossing another. Study, WC and kitchen open off it; living and dining meet in one long room across the back, open to each other and to the garden.

Upstairs, the landing wraps around the stair void. Two equal bedrooms take the west side, the bathroom and the main bedroom the east, and the ensuite sits over the hall, between them.
"""
body.ko = """
현관 홀은 현관문에서 정원 쪽까지 이어지고 계단은 홀의 벽을 따라 놓여 있어, 어느 방이든 다른 방을 거치지 않고 들어갈 수 있어요. 서재, 화장실, 주방이 홀에서 열리고, 거실과 식당은 뒤쪽의 긴 한 공간에서 만나 서로에게, 그리고 정원으로 열려 있어요.

위층에서는 홀이 계단 오픈 공간을 감싸요. 같은 크기의 침실 두 개가 서쪽을, 욕실과 안방이 동쪽을 차지하고, 전용 욕실은 그 사이 현관 홀 위에 놓여요.
"""
plan = "family-house"

