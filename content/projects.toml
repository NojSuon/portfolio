[[project]]
slug = "corner-boutique"
title.es = "Boutique en esquina"
title.en = "Corner Boutique"
title.ko = "코너 부티크"
discipline = "plans"
year = "2026"
kind.es = "Comercio · Planta baja"
kind.en = "Retail · Ground floor"
kind.ko = "상업 · 1층"
summary.es = "Una tienda de moda en una esquina: un solo piso de ventas detrás de dos fachadas de vidrio, con todo lo que lo sirve llevado al fondo."
summary.en = "A fashion boutique on a street corner: one open sales floor behind two glazed fronts, with everything that serves it pushed to the back."
summary.ko = "길모퉁이의 패션 부티크. 유리로 된 두 면의 파사드 뒤에 하나의 열린 매장을 두고, 매장을 지원하는 공간은 모두 뒤쪽으로 밀어 넣었어요."
body.es = """
El piso de ventas ocupa toda la esquina, así que los dos frentes a la calle son escaparate. Las mesas de exhibición se ordenan en retícula bajo la luz, la estantería corre por el muro ciego, y los percheros y probadores se juntan cerca de la caja para que el personal vea toda la tienda desde un solo punto.

Bodega, oficina y baño del personal forman una sola franja de servicio con su propia ventana al fondo: fuera de la vista de la tienda, pero a un paso de ella.
"""
body.en = """
The sales floor takes the whole corner, so both street fronts are shop window. Display tables sit on a grid in the light, shelving runs along the blind wall, and the rails and fitting rooms gather near the till so staff can see the whole floor from one place.

Stock, office and staff WC form a single back-of-house strip with its own window to the rear, out of sight from the shop but one step from it.
"""
body.ko = """
매장이 모퉁이 전체를 차지하므로 길에 면한 두 면이 모두 쇼윈도가 돼요. 진열대는 빛이 드는 자리에 격자로 놓이고, 선반은 창 없는 벽을 따라 이어지며, 행거와 탈의실은 계산대 가까이에 모여 직원이 한 자리에서 매장 전체를 볼 수 있어요.

창고, 사무실, 직원 화장실은 뒤쪽에 창을 둔 하나의 후방 공간으로 묶었어요. 매장에서는 보이지 않지만, 한 걸음이면 닿는 거리예요.
"""
plan = "boutique"

