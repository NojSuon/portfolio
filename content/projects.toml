The lifts open onto a lobby that widens the corridor at its middle, so guests arrive at a room rather than in a passage. Across from it, behind closed doors, sit the two escape stairs and the linen room that housekeeping works from.
"""
body.ko = """
객실은 건물 전체의 축소판이므로 한 번 그려서 반복해요. 폭 3.8 m, 문 옆에는 욕실과 옷장, 창 옆에는 침대와 책상. 열 개의 객실은 북쪽을, 열 개는 남쪽을 바라봐요.

엘리베이터는 복도 가운데를 넓힌 홀로 열려, 손님은 통로가 아닌 하나의 공간에 도착해요. 그 맞은편 닫힌 문 뒤에는 피난 계단 두 개와 객실 관리 직원이 일하는 린넨실이 있어요.
"""
plan = "hotel"

