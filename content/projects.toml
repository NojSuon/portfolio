body.es = """
La chinampa puede abrirse en sus nueve capas (estacas, troncos, tule, lodo, tierra) y leerse en vista axonométrica, una capa a la vez. A su alrededor, la vida del lago: tules, peces, ajolotes, garzas y los volcanes en el horizonte.

Disponible en español, inglés y chino.
"""
