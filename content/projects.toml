[[project]]
slug = "urbanitas"
title = "Urbanitas"
discipline = "tools"
year = "2026"
kind.es = "Arquitectura procedural · Rust"
kind.en = "Procedural architecture · Rust"
kind.ko = "절차적 건축 · Rust"
summary.es = "Un generador y constructor de paisajes, pueblos y casas, donde la arquitectura se vuelve un conjunto de reglas."
summary.en = "A generator and builder for landscapes, towns and houses, where architecture becomes a set of rules."
summary.ko = "풍경과 마을과 집을 생성하고 짓는 도구. 건축이 하나의 규칙 체계가 돼요."
body.es = """
Urbanitas trabaja en tres escalas. Genera terreno: colinas, montañas, valles, mares con playas o acantilados, lagos y ríos. Haz clic donde va la plaza y un pueblo crece hacia afuera siguiendo las curvas de nivel, con sus casas mirando a las calles, cada una en su propia terraza.

Cada casa se genera a partir de unos pocos parámetros (pisos, tamaño, tipo, habitaciones, forma de la planta y estilo) hasta sus arcos, ventanas, balcones, techo y jardín. Todo está hecho de piezas modulares, así que cualquier casa puede editarse pieza por pieza, guardarse como diseño y reutilizarse en los pueblos.
"""
body.en = """
Urbanitas works at three scales. It generates terrain: hills, mountains, valleys, seas with beaches or cliffs, lakes and rivers. Click where the piazza goes and a town grows outwards along the contours, its houses facing the streets, each on its own terraced pad.

Every house is generated from a few parameters (floors, size, type, rooms, plan shape and style) down to its archways, windows, balconies, roof and garden. Everything is made of modular parts, so any house can be edited piece by piece, saved as a design, and reused by the towns.
"""
body.ko = """
Urbanitas는 세 가지 규모에서 작동해요. 언덕, 산, 계곡, 해변이나 절벽이 있는 바다, 호수와 강 같은 지형을 생성해요. 광장이 놓일 자리를 클릭하면 마을이 등고선을 따라 바깥으로 자라나고, 집들은 저마다의 계단식 터 위에서 길을 바라봐요.

