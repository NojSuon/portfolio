La habitación es todo el edificio en miniatura, así que se dibuja una vez y se repite: 3.8 m de ancho, baño y clóset junto a la puerta, cama y escritorio junto a la ventana. Diez habitaciones miran al norte y diez al sur.

Los elevadores abren a un vestíbulo que ensancha el pasillo en su centro, para que los huéspedes lleguen a un espacio y no a un corredor. Enfrente, tras puertas cerradas, están las dos escaleras de emergencia y la ropería desde donde trabaja el personal de limpieza.
