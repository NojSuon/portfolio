# ─── Tools & Software ─────────────────────────────────────────────────────────

[[project]]
slug = "urbanitas"
title = "Urbanitas"
discipline = "tools"
year = "2026"
kind = "Procedural architecture · Rust"
summary = "A generator and builder for landscapes, towns and houses, where architecture becomes a set of rules."
body = """
Urbanitas works at three scales. It generates terrain: hills, mountains, valleys, seas with beaches or cliffs, lakes and rivers. Click where the piazza goes and a town grows outwards along the contours, its houses facing the streets, each on its own terraced pad.

Every house is generated from a few parameters (floors, size, type, rooms, plan shape and style) down to its archways, windows, balconies, roof and garden. Everything is made of modular parts, so any house can be edited piece by piece, saved as a design, and reused by the towns.
"""
facts = [
  { label = "Built with", value = "Rust" },
]
links = [
  { label = "Source", url = "https://github.com/NojSuon/urbanitas" },
]

[[project]]
slug = "coniugatio"
title = "coniugatio"
discipline = "tools"
year = "2026"
kind = "Language tool · Rust, WebAssembly"
summary = "A site to learn about indigenous languages and conjugate their verbs, with the whole engine running in the browser."
body = """
The conjugation engine is written in Rust and handles clitics, root changes and plurals. Compiled to WebAssembly, it runs entirely in the browser, so the site is static and needs no server.

Part of Mati Mati, a project about Mesoamerican languages and cultures.
"""
facts = [
  { label = "Built with", value = "Rust, WebAssembly" },
]
links = [
  { label = "Visit site", url = "https://nojsuon.github.io/coniugatio/" },
  { label = "Source", url = "https://github.com/NojSuon/coniugatio" },
]

[[project]]
slug = "chinamitl"
title = "Chinamitl"
discipline = "tools"
year = "2026"
kind = "Interactive 3D explorer · three.js"
summary = "A low-poly explorer of a chinampa, layer by layer, and of how thousands of them formed the blocks of Mexiko-Tenochtitlan."
body = """
The chinampa can be opened into its nine layers (stakes, logs, tule, mud, soil) and read in an axonometric view, one layer at a time. Around it, the life of the lake: reeds, fish, axolotls, herons, and the volcanoes on the horizon.

Available in Spanish, English and Chinese.
"""
facts = [
  { label = "Built with", value = "JavaScript, three.js" },
]
