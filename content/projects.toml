모든 방이 중정을 바라봐요. 주방과 거실은 중정 쪽으로 미닫이 유리벽을 둔 하나의 긴 날개를 함께 쓰고, 양쪽의 침실로는 유리 갤러리를 지나 들어가므로 잠자리로 가는 길이 정원을 한 바퀴 도는 산책이 돼요.

문이 달린 낮은 담이 중정의 남쪽을 닫아, 여름에는 바깥 방이 되고 나머지 계절에는 바람을 막아 주는 정원이 돼요.
